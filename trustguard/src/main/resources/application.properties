spring.application.name=trustguard
spring.datasource.url=jdbc:postgresql://localhost:5432/trustguard
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
jwt.secret=${JWT_SECRET}
jwt.expiration=86400000
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
logging.level.org.springframework.security=DEBUG
gemini.api.key=${GEMINI_API_KEY}
groq.api-key=${GROQ_API_KEY}
webrisk.api.key=${WEBRISK_API_KEY}
spring.data.redis.host=localhost
spring.data.redis.port=6379
trustguard.rate-limit.capacity=10
trustguard.rate-limit.refill-tokens=10
trustguard.rate-limit.refill-duration=1m